<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - AltSchool Africa</title>
  </head>

  <body>
    <!-- navigation at the top of the page -->
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="form.html">Sign In</a></li>
        </ul>
      </nav>
    </header>

    <!-- main content -->
    <main>
      <section>
        <div>
          <a> Sign up </a>

          <a> Sign in </a>
        </div>
        <h1>Sign in</h1>
        <p>
          Enter your email address and password to securely log in to AltSchool
          Student Portal
        </p>

        <form action="#" method="post">
          <fieldset>
            <legend>Login Details</legend>

            <p>
              <label for="email">Email</label>
              <br />
              <input
                type="email"
                id="email"
                name="email"
                placeholder="john.doe@example.com"
                required
              />
            </p>

            <p>
              <label for="password">Password</label>
              <br />
              <input
                type="password"
                id="password"
                name="password"
                placeholder="********"
                required
              />
            </p>

            <p>
              <button type="submit">Proceed to Dashboard →</button>
            </p>
          </fieldset>

          <p>
            <a>Forgot Password?</a> <a href="#"><u>Reset Now!</u></a>
          </p>
          <p>OR</p>
          <p><a href="#">Login with Google</a></p>
        </form>
      </section>
    </main>

    <footer>
      <address>Abeokuta, Ogun State, Nigeria</address>
      <p>
        <small>&copy; 2026 Oyewole Saheed Abiola. All rights reserved.</small>
      </p>
    </footer>
  </body>
</html>
