<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - AltSchool Africa</title>
  </head>

  <body>
    <!-- navigation at the top of the page -->
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="form.html">Sign In</a></li>
        </ul>
      </nav>
    </header>

    <!-- main content -->
    <main>
      <section>
        <div
          style="
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 720px;
            height: 70px;
            padding: 9px;
            box-sizing: border-box;
            background: #e6f0ff;
            border-radius: 50px;
          "
        >
          <a
            href="#signup"
            style="
              flex: 1;
              text-align: center;
              text-decoration: none;
              color: #111;
              font-size: 20px;
              font-family: Arial, sans-serif;
              padding: 15px 0;
            "
          >
            Sign up
          </a>

          <a
            href="#signin"
            style="
              flex: 1;
              text-align: center;
              text-decoration: none;
              color: #2474d8;
              font-size: 20px;
              font-family: Arial, sans-serif;
              background: #fff;
              border-radius: 50px;
              padding: 15px 0;
              box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
            "
          >
            Sign in
          </a>
        </div>
        <h1>Sign in to your account</h1>

        <form action="#" method="post">
          <fieldset>
            <legend>Login Details</legend>

            <p>
              <label for="email">Email Address</label>
              <br />
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </p>

            <p>
              <label for="password">Password</label>
              <br />
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </p>

            <p>
              <input type="checkbox" id="remember" name="remember" />
              <label for="remember">Remember me</label>
            </p>

            <p>
              <button type="submit">Sign In</button>
            </p>
          </fieldset>

          <p><a href="#">Forgot Password?</a></p>

          <p><a href="#">Continue with Google</a></p>

          <p>Don't have an account? <a href="#">Sign Up</a></p>
        </form>
      </section>
    </main>

    <footer>
      <address>Abeokuta, Ogun State, Nigeria</address>
      <p>
        <small>&copy; 2026 Oyewole Saheed Abiola. All rights reserved.</small>
      </p>
    </footer>
  </body>
</html>
